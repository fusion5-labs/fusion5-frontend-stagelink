<svg viewBox="0 0 850 50" xmlns="http://www.w3.org/2000/svg" width="100%" height="50">
  <defs>
    <linearGradient id="waveBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#4338ca"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="fadeLineLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="fadeLineRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes barWave1 { 0%, 100% { height: 6px; y: 22px; } 50% { height: 34px; y: 8px; } }
    @keyframes barWave2 { 0%, 100% { height: 26px; y: 12px; } 50% { height: 10px; y: 20px; } }
    @keyframes barWave3 { 0%, 100% { height: 14px; y: 18px; } 50% { height: 40px; y: 5px; } }
    @keyframes barWave4 { 0%, 100% { height: 32px; y: 9px; } 50% { height: 8px; y: 21px; } }
    @keyframes barWave5 { 0%, 100% { height: 8px; y: 21px; } 50% { height: 28px; y: 11px; } }
    @keyframes floatNote1 {
      0% { transform: translate(0, 0); opacity: 0; }
      30% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translate(12px, -24px); opacity: 0; }
    }
    @keyframes floatNote2 {
      0% { transform: translate(0, 0); opacity: 0; }
      40% { opacity: 0.7; }
      85% { opacity: 0.4; }
      100% { transform: translate(-10px, -26px); opacity: 0; }
    }

    .bw1 { animation: barWave1 1.1s ease-in-out infinite; }
    .bw2 { animation: barWave2 0.85s ease-in-out infinite; }
    .bw3 { animation: barWave3 1.35s ease-in-out infinite; }
    .bw4 { animation: barWave4 0.95s ease-in-out infinite; }
    .bw5 { animation: barWave5 1.2s ease-in-out infinite; }
    .note-float1 { animation: floatNote1 3.5s ease-in-out infinite; font-family: sans-serif; font-size: 13px; fill: #a78bfa; }
    .note-float2 { animation: floatNote2 4s ease-in-out infinite 1.5s; font-family: sans-serif; font-size: 14px; fill: #818cf8; }
    .note-float3 { animation: floatNote1 3.8s ease-in-out infinite 0.7s; font-family: sans-serif; font-size: 11px; fill: #c7d2fe; }
    .note-float4 { animation: floatNote2 4.2s ease-in-out infinite 2.2s; font-family: sans-serif; font-size: 12px; fill: #a78bfa; }
  </style>

  <!-- Left & Right Glowing Horizontal Sound Track Rails -->
  <line x1="0" y1="25" x2="220" y2="25" stroke="url(#fadeLineLeft)" stroke-width="1.5"/>
  <line x1="630" y1="25" x2="850" y2="25" stroke="url(#fadeLineRight)" stroke-width="1.5"/>

  <!-- Floating Musical Notes -->
  <text x="280" y="30" class="note-float1">♪</text>
  <text x="390" y="28" class="note-float2">♫</text>
  <text x="460" y="32" class="note-float3">♬</text>
  <text x="560" y="27" class="note-float4">♩</text>

  <!-- Centered Audio Equalizer Frequency Bars -->
  <g transform="translate(230, 0)">
    <rect class="bw1" x="0" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="7" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="14" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="21" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="28" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw1" x="35" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="42" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="49" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="56" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="63" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="70" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw1" x="77" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="84" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="91" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="98" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="105" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw1" x="112" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="119" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="126" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="133" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="140" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw1" x="147" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="154" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="161" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="168" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="175" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw1" x="182" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="189" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="196" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="203" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="210" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw1" x="217" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="224" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="231" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="238" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="245" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw1" x="252" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="259" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="266" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="273" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="280" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw1" x="287" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="294" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="301" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="308" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="315" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw1" x="322" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="329" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="336" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="343" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="350" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw1" x="357" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw3" x="364" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw5" x="371" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw4" x="378" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
    <rect class="bw2" x="385" width="3" rx="1.5" fill="url(#waveBarGrad)"/>
  </g>
</svg>
